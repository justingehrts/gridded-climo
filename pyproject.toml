[project]
name = "gridded-climo"
version = "0.1.0"
description = "Gridded climate maps for broadcast graphics (ACIS / NOHRSC -> GeoTIFF -> KMZ)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8", "Pillow>=10.0", "rasterio>=1.3", "requests>=2.31", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gridded-climo = "gridded_climo.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gridded_climo*"]

[tool.setuptools.package-data]
gridded_climo = ["metrics.yaml", "states.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["threaded: exercises threaded-record lookups", "network: hits live ACIS/NOHRSC (run with RUN_NETWORK_TESTS=1)"]
